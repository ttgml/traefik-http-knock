# Traefik Middleware that enables the HTTP knock allowlist.
#
# Replace REPLACE_WITH_64_HEX_CHARS with a secret generated by:
#   openssl rand -hex 32
# and REPLACE_WITH_REDIS_PASSWORD with the value of the redis-auth Secret:
#   kubectl -n traefik-http-knock get secret redis-auth -o jsonpath='{.data.password}' | base64 -d
#
# The Traefik Middleware CRD cannot reference a Secret, so render this manifest
# from your secret pipeline (SOPS, sealed-secrets, `envsubst`/`sed` at apply
# time) and never commit the real values.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: http-knock
  namespace: traefik-http-knock
  labels:
    app.kubernetes.io/name: traefik-http-knock
spec:
  plugin:
    httpKnock:
      # Exact path that triggers the knock. Keep the secret long and random.
      knockPath: "/__knock__/REPLACE_WITH_64_HEX_CHARS"

      # Allowlist entry lifetime. Redis expires the key.
      ttl: "2h"

      # Redis state store (in-cluster Service from deploy/redis.yaml).
      redisAddr: "redis.traefik-http-knock.svc.cluster.local:6379"
      redisPassword: "REPLACE_WITH_REDIS_PASSWORD"
      redisDB: 0

      # Redis key namespace.
      keyPrefix: "traefik:http-knock:"

      # SECURITY: leave empty to use the TCP peer address (req.RemoteAddr).
      # Only set this when a trusted reverse proxy always overwrites the
      # header, e.g. "CF-Connecting-IP" behind Cloudflare or "X-Real-IP"
      # behind a load balancer that replaces it.
      clientIPHeader: ""

      # Optional. IPs and CIDR ranges that are always allowed: no knock and no
      # Redis lookup (so they keep working during a Redis outage). In password
      # and Basic mode a match also bypasses authentication entirely, so only
      # list networks you fully trust. Single IPs or CIDR ranges, IPv4 or IPv6.
      # Empty means only knocks grant access.
      staticAllowlist: []
      #  - "203.0.113.7"
      #  - "192.168.0.0/16"
      #  - "2001:db8::/32"

      # Never let a Redis outage turn into an allowlist hit.
      failClosed: true

      dialTimeout: "2s"
      readTimeout: "1s"
      writeTimeout: "1s"
      redisPoolSize: 16

      # Prevent a shared cache/CDN from storing an authorized response.
      privateResponses: true

      # Client IPs stay out of the logs unless you opt in.
      logClientIP: false
