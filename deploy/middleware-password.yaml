# Password-mode example.
#
# Generate a bare hash for the inline users below with:
#   go run ./cmd/knockhash
# For a credentials file line (username:hash), use:
#   go run ./cmd/knockhash -username alice
#
# Generate a cookie secret with:
#   openssl rand -base64 32
#
# For production, prefer credentialsFile/cookieSecretFile mounted from a Secret
# instead of inline values. The Middleware CRD cannot reference Secrets itself.
# Traefik DEBUG logs can echo this entire dynamic configuration, including the
# cookie secret and password hashes; keep Traefik at INFO in production.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: http-knock-password
  namespace: traefik-http-knock
  labels:
    app.kubernetes.io/name: traefik-http-knock
spec:
  plugin:
    httpKnock:
      # GET renders the login page; POST logs in; POST action=logout revokes.
      knockPath: "/__knock__"
      loginPath: "/__knock__"
      authMode: password
      # After login, send the browser to the homepage. Logout redirects back
      # to loginPath.
      redirectURL: "/"

      # One entry per user. Paste the bare hash (cmd/knockhash output without
      # -username) as passwordHash.
      users:
        - username: alice
          passwordHash: "pbkdf2-sha256$120000$REPLACE_WITH_BASE64_SALT$REPLACE_WITH_BASE64_HASH"
        - username: bob
          passwordHash: "pbkdf2-sha256$120000$REPLACE_WITH_BASE64_SALT$REPLACE_WITH_BASE64_HASH"

      # session (Redis cookie/token), ip (IP allowlist) or both.
      # With ip, no session/Bearer token is issued or accepted.
      grantMode: session
      sessionTTL: "12h"

      # Set at least 32 random bytes, identical on every Traefik replica.
      # The placeholder is deliberately too short, so this example fails
      # validation until it is replaced.
      cookieSecret: "REPLACE_ME"
      cookieSecure: true
      cookieSameSite: "Lax"

      # Stable realm for Redis keys and signed tokens. Defaults to the
      # middleware name plus a digest of the auth endpoints. Set it explicitly
      # if you may rename the Middleware or share this Redis database.
      realm: "example-com"

      # Login brute-force protection. Every attempt counts; success clears it.
      maxLoginAttempts: 5
      loginWindow: "15m"
      maxConcurrentLogins: 4

      # Prevent a CDN from caching an authenticated response.
      privateResponses: true

      # Optional: pass the authenticated username to the backend. Client
      # supplied values are stripped first.
      forwardUserHeader: ""

      redisAddr: "redis.traefik-http-knock.svc.cluster.local:6379"
      redisPassword: "REPLACE_WITH_REDIS_PASSWORD"
      keyPrefix: "traefik:http-knock:"
      failClosed: true

      dialTimeout: "2s"
      readTimeout: "1s"
      writeTimeout: "1s"
      redisPoolSize: 16

      logClientIP: false
