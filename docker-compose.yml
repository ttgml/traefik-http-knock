# Local end-to-end demo: Traefik (with the plugin) + Redis + whoami.
#
#   docker compose up -d --build
#   curl -i http://localhost:8000/                 # 403
#   curl -i http://localhost:8000/__knock__/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
#                                                  # 204
#   curl -i http://localhost:8000/                 # 200 (whoami output)
#
# The secret and Redis password below are development placeholders: replace
# them (`openssl rand -hex 32`) and never reuse them in production.
services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - "--requirepass"
      - devpassword
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory-policy"
      - noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -a devpassword ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - knock-demo

  whoami:
    image: traefik/whoami:v1.10.1
    networks:
      - knock-demo

  traefik:
    build:
      context: .
      args:
        PLUGIN_MODULE: github.com/ttgml/traefik-http-knock
    command:
      - --configFile=/etc/traefik/traefik-compose.yml
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/traefik-compose.yml:/etc/traefik/traefik-compose.yml:ro
      - ./deploy/traefik-compose-dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      redis:
        condition: service_healthy
      whoami:
        condition: service_started
    networks:
      - knock-demo

networks:
  knock-demo:
    name: knock-demo
