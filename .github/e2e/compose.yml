# Standalone stack for the end-to-end smoke test, driven by
# .github/scripts/e2e-compose.sh.
#
# It deliberately does not extend docker-compose.yml: CI runners may execute a
# job inside a container whose workspace does not exist on the Docker host, so
# relative bind mounts would silently become empty directories. The e2e build
# stage bakes the Traefik configuration into the image instead.
name: knock-e2e

services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - "--requirepass"
      - devpassword
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -a devpassword ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  whoami:
    image: traefik/whoami:v1.10.1

  traefik:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: e2e
      args:
        PLUGIN_MODULE: github.com/ttgml/traefik-http-knock
    command:
      - --configFile=/etc/traefik/traefik-compose.yml
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      whoami:
        condition: service_started
